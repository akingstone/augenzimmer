<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Augenzimmer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; cursor: none; }
  html, body { height: 100%; height: 100dvh; }
  /* ganzes 16:9-Bild immer sichtbar (auch mit Browserleiste), Rest bleibt schwarz */
  video, canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100%; height: 100dvh; object-fit: contain; background: #000; }
  #auge { opacity: 0; }
  #stoer { opacity: 0; image-rendering: pixelated; pointer-events: none; }
</style>
</head>
<body>
<video id="news" src="video/nachrichten.mp4" muted playsinline webkit-playsinline autoplay preload="auto"></video>
<video id="auge" src="video/auge.mp4" muted playsinline webkit-playsinline preload="auto"></video>
<canvas id="stoer" width="160" height="90"></canvas>

<script>
// ---------------------------------------------------------------------------
// Augenzimmer – einfache Schleife:
// Nachrichten (ganz) -> Störbild -> Auge (ganz) -> Störbild -> Nachrichten ...
// Einmal tippen = Vollbild. Bildschirm bleibt an (über HTTPS).
// ---------------------------------------------------------------------------
var news = document.getElementById('news');
var auge = document.getElementById('auge');
var st = document.getElementById('stoer'), sctx = st.getContext('2d');

function stoerbild(dauer, mitte, danach) {
  var start = performance.now(), gewechselt = false;
  function bild(now) {
    var t = now - start;
    var img = sctx.createImageData(160, 90), d = img.data;
    for (var i = 0; i < d.length; i += 4) { var v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    sctx.putImageData(img, 0, 0);
    var farben = ['#fff', '#ff0', '#0ff', '#0f0', '#f0f', '#f00', '#00f'];
    for (var b = 0; b < 4; b++) {
      var y = Math.random() * 90, h = 2 + Math.random() * 10;
      for (var f = 0; f < 7; f++) { sctx.fillStyle = farben[f]; sctx.globalAlpha = 0.6; sctx.fillRect(f * 23 + (Math.random() - .5) * 30, y, 23, h); }
    }
    sctx.globalAlpha = 1;
    st.style.opacity = t < 100 ? 0.5 : 0.95;
    if (!gewechselt && t > dauer / 2) { gewechselt = true; mitte(); }
    if (t < dauer) requestAnimationFrame(bild);
    else { st.style.opacity = 0; if (danach) danach(); }
  }
  requestAnimationFrame(bild);
}

function zeigeAuge() {
  stoerbild(700, function () {
    news.pause(); news.style.opacity = 0;
    auge.currentTime = 0; auge.style.opacity = 1; auge.play();
  });
}
function zeigeNachrichten() {
  stoerbild(600, function () {
    auge.pause(); auge.style.opacity = 0;
    news.currentTime = 0; news.style.opacity = 1; news.play();
  });
}
news.addEventListener('ended', zeigeAuge);
auge.addEventListener('ended', zeigeNachrichten);

// Start (falls Autoplay blockiert ist, startet es beim ersten Tippen)
var p = news.play(); if (p && p.catch) p.catch(function () {});

var sperre = null;
function wachHalten() {
  if ('wakeLock' in navigator && !sperre)
    navigator.wakeLock.request('screen').then(function (s) { sperre = s; s.addEventListener('release', function () { sperre = null; }); }).catch(function () {});
}
wachHalten();
document.addEventListener('click', function () {
  if (news.style.opacity !== '0') news.play(); else auge.play();
  var el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fs && !document.fullscreenElement && !document.webkitFullscreenElement) { try { fs.call(el); } catch (e) {} }
  wachHalten();
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { wachHalten(); (news.style.opacity === '0' ? auge : news).play(); }
});
</script>
</body>
</html>
